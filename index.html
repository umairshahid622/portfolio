<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark; background-color: #283618;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function() {
        // Enforce manual scroll restoration and reset scroll position to Hero (top: 0) on load/reload
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        // Strip any URL anchor hash so browser does not scroll or jump down on reload
        if (window.location.hash) {
          window.history.replaceState(null, '', window.location.pathname + window.location.search);
        }

        window.addEventListener('beforeunload', function() {
          window.scrollTo(0, 0);
        });

        window.addEventListener('DOMContentLoaded', function() {
          window.scrollTo(0, 0);
        });

        window.addEventListener('load', function() {
          window.scrollTo(0, 0);
        });

        try {
          var stored = localStorage.getItem('portfolio-theme');
          var isDark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
            root.style.backgroundColor = '#283618';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
            root.style.backgroundColor = '#fefae0';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Critical inline styles to prevent FOUC / flash before CSS loads */
      html {
        background-color: #283618;
        color: #fefae0;
      }
      html:not(.dark) {
        background-color: #fefae0;
        color: #283618;
      }
      body {
        margin: 0;
        background-color: inherit;
        color: inherit;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon_io_porfolio/android-chrome-512x512.png" />
    <link rel="preload" href="/fonts/ClashDisplay-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Archivo-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>Umair | Portfolio</title>
  </head>
  <body style="background-color: inherit; color: inherit;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
